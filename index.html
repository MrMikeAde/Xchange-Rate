<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xchange Rate — free, live currency converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css">
<style>
  :root{
    --green:#9FE870;
    --green-dark:#7FCB4F;
    --forest:#163300;
    --ink:#0E1A05;
    --bg:#FFFFFF;
    --card:#F4F6F1;
    --border:#E5E9DE;
    --muted:#5C6B52;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--forest);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:56px 20px;
  }
  .wrap{ width:100%; max-width:520px; position:relative; }
  .brandmark{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:24px;
  }
  .brandmark .dot{
    width:14px; height:14px; border-radius:50%;
    background:var(--green);
  }
  .brandmark span{
    font-weight:700; font-size:15px; letter-spacing:-0.01em;
  }
  h1{
    font-size:34px;
    font-weight:700;
    letter-spacing:-0.02em;
    line-height:1.15;
    margin:0 0 6px;
  }
  .sub{
    color:var(--muted);
    font-size:15px;
    margin:0 0 28px;
  }
  .card{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:24px;
    padding:8px;
    position:relative;
  }
  .panel{
    background:var(--card);
    border-radius:var(--radius);
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .panel + .panel{ margin-top:4px; }
  .panel label{
    display:block;
    font-size:12px;
    color:var(--muted);
    font-weight:500;
    margin-bottom:4px;
  }
  .panel input[type=number]{
    width:100%;
    background:none;
    border:none;
    outline:none;
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    font-size:28px;
    font-weight:700;
    padding:0;
  }
  .amount-col{ flex:1; min-width:0; }
  .ccy-trigger{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:999px;
    padding:8px 12px 8px 8px;
    cursor:pointer;
    flex:0 0 auto;
    font-family:'Space Grotesk',sans-serif;
  }
  .ccy-trigger:hover{ border-color:var(--green-dark); }
  .flag-circle{
    width:26px; height:26px; border-radius:50%;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    background:var(--card);
    flex:0 0 26px;
  }
  .flag-circle .fi{
    width:38px; height:38px;
    background-size:cover;
    background-position:center;
  }
  .ccy-trigger .code{
    font-weight:700;
    font-size:15px;
    color:var(--ink);
  }
  .ccy-trigger .chev{
    color:var(--muted);
    font-size:11px;
    margin-left:2px;
  }
  .swap-row{
    display:flex;
    justify-content:center;
    margin:2px 0;
    position:relative;
    height:0;
  }
  .swap{
    position:relative;
    top:-14px;
    width:40px; height:40px;
    border-radius:50%;
    background:var(--green);
    border:4px solid var(--bg);
    color:var(--forest);
    cursor:pointer;
    font-size:16px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
    transition:transform 0.15s ease;
    z-index:2;
  }
  .swap:hover{ transform:rotate(180deg); }
  .rate-strip{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 12px 8px;
    font-size:14px;
    color:var(--muted);
  }
  .rate-strip strong{ color:var(--ink); font-weight:700; }
  .stats{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin-top:20px;
  }
  .stat{
    background:var(--card);
    border-radius:16px;
    padding:14px 12px;
    text-align:left;
  }
  .stat .k{ font-size:11px; color:var(--muted); font-weight:500; }
  .stat .v{ font-size:17px; font-weight:700; margin-top:4px; color:var(--ink); }
  .status{
    font-size:13px;
    color:var(--muted);
    margin-top:16px;
    text-align:center;
  }
  .status.err{ color:#B3401F; }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--card);
    border-radius:999px;
    padding:6px 12px;
    font-size:12px;
    font-weight:500;
    color:var(--muted);
    margin-top:24px;
  }
  .badge .dot{ width:8px; height:8px; border-radius:50%; background:var(--green-dark); }
  footer{
    margin-top:14px;
    font-size:12px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:6px;
  }
  footer a{
    color:var(--forest);
    display:flex;
    align-items:center;
    gap:6px;
    text-decoration:none;
  }
  footer a:hover{ color:var(--green-dark); }
  footer svg{ width:16px; height:16px; }

  .picker-backdrop{
    position:fixed;
    inset:0;
    background:rgba(14,26,5,0.35);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:80px 20px;
    z-index:50;
  }
  .picker-backdrop.open{ display:flex; }
  .picker{
    background:var(--bg);
    border-radius:20px;
    border:1px solid var(--border);
    width:100%;
    max-width:400px;
    max-height:70vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .picker-search{
    display:flex;
    align-items:center;
    gap:8px;
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    flex:0 0 auto;
  }
  .picker-search svg{ flex:0 0 auto; color:var(--muted); }
  .picker-search input{
    flex:1;
    border:none;
    outline:none;
    background:none;
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  .picker-list{
    overflow-y:auto;
    padding:6px;
  }
  .picker-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 10px;
    border-radius:12px;
    cursor:pointer;
  }
  .picker-item:hover{ background:var(--card); }
  .picker-item .code{ font-weight:700; font-size:14px; color:var(--ink); width:44px; flex:0 0 44px; }
  .picker-item .name{ font-size:14px; color:var(--muted); flex:1; }
  .picker-item .check{ color:var(--green-dark); flex:0 0 auto; opacity:0; }
  .picker-item.selected .check{ opacity:1; }
  .picker-empty{
    padding:24px 16px;
    text-align:center;
    font-size:13px;
    color:var(--muted);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brandmark"><div class="dot"></div><span>Xchange Rate</span></div>
  <h1>Convert currencies,<br>ad free.</h1>
  <p class="sub">Live mid-market rates from the European Central Bank. No account, no fees, no cost.</p>

  <div class="card">
    <div class="panel">
      <div class="amount-col">
        <label>Amount</label>
        <input type="number" id="amount" value="1000" min="0" step="any">
      </div>
      <div class="ccy-trigger" id="fromTrigger">
        <div class="flag-circle"><span class="fi" id="fromFlag"></span></div>
        <span class="code" id="fromCode">GBP</span>
        <span class="chev">&#9662;</span>
      </div>
    </div>

    <div class="swap-row"><div class="swap" id="swap" title="Swap currencies">&#8645;</div></div>

    <div class="panel">
      <div class="amount-col">
        <label>Converted to</label>
        <div id="resultAmount" style="font-size:28px; font-weight:700; color:var(--ink);">—</div>
      </div>
      <div class="ccy-trigger" id="toTrigger">
        <div class="flag-circle"><span class="fi" id="toFlag"></span></div>
        <span class="code" id="toCode">EUR</span>
        <span class="chev">&#9662;</span>
      </div>
    </div>

    <div class="rate-strip">
      <span>Mid-market rate</span>
      <strong id="rateValue">—</strong>
    </div>
  </div>

  <div class="stats" id="stats">
    <div class="stat"><div class="k">30d high</div><div class="v" id="statHigh">—</div></div>
    <div class="stat"><div class="k">30d low</div><div class="v" id="statLow">—</div></div>
    <div class="stat"><div class="k">30d avg</div><div class="v" id="statAvg">—</div></div>
  </div>

  <div class="status" id="status">Loading rates…</div>

  <div class="badge"><div class="dot"></div>No mark-up, no ads, no sign-up</div>

  <footer>
    Built by
    <a href="https://github.com/mrmikeade" target="_blank" rel="noopener" aria-label="mrmikeade on GitHub">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      mrmikeade
    </a>
  </footer>
</div>

<div class="picker-backdrop" id="pickerBackdrop">
  <div class="picker">
    <div class="picker-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="pickerSearch" placeholder="Search...">
    </div>
    <div class="picker-list" id="pickerList"></div>
  </div>
</div>

<script>
const API = "https://api.frankfurter.dev/v1";
const amountEl = document.getElementById('amount');
const resultAmount = document.getElementById('resultAmount');
const rateValue = document.getElementById('rateValue');
const statusEl = document.getElementById('status');
const statHigh = document.getElementById('statHigh');
const statLow = document.getElementById('statLow');
const statAvg = document.getElementById('statAvg');

const fromCode = document.getElementById('fromCode');
const toCode = document.getElementById('toCode');
const fromFlag = document.getElementById('fromFlag');
const toFlag = document.getElementById('toFlag');
const fromTrigger = document.getElementById('fromTrigger');
const toTrigger = document.getElementById('toTrigger');

const pickerBackdrop = document.getElementById('pickerBackdrop');
const pickerSearch = document.getElementById('pickerSearch');
const pickerList = document.getElementById('pickerList');

const CURRENCIES = {
  USD:["US Dollar","us"], EUR:["Euro","eu"], GBP:["British Pound Sterling","gb"],
  JPY:["Japanese Yen","jp"], AUD:["Australian Dollar","au"], CAD:["Canadian Dollar","ca"],
  CHF:["Swiss Franc","ch"], CNY:["Chinese Yuan","cn"], NZD:["New Zealand Dollar","nz"],
  SEK:["Swedish Krona","se"], NOK:["Norwegian Krone","no"], DKK:["Danish Krone","dk"],
  INR:["Indian Rupee","in"], SGD:["Singapore Dollar","sg"], HKD:["Hong Kong Dollar","hk"],
  MXN:["Mexican Peso","mx"], ZAR:["South African Rand","za"], BRL:["Brazilian Real","br"],
  TRY:["Turkish Lira","tr"], PLN:["Polish Zloty","pl"], CZK:["Czech Koruna","cz"],
  HUF:["Hungarian Forint","hu"], ILS:["Israeli New Shekel","il"], KRW:["South Korean Won","kr"],
  MYR:["Malaysian Ringgit","my"], IDR:["Indonesian Rupiah","id"], PHP:["Philippine Peso","ph"],
  RON:["Romanian Leu","ro"], BGN:["Bulgarian Lev","bg"], ISK:["Icelandic Krona","is"],
  THB:["Thai Baht","th"]
};

let state = { from: 'GBP', to: 'EUR', pickerTarget: null };

function fmt(n){
  try{ return new Intl.NumberFormat('en-GB', { style:'decimal', maximumFractionDigits: 4 }).format(n); }
  catch(e){ return n.toFixed(4); }
}

function setFlag(el, code){
  const iso = CURRENCIES[code] ? CURRENCIES[code][1] : 'un';
  el.className = 'fi fi-' + iso;
}

function renderTriggers(){
  fromCode.textContent = state.from;
  toCode.textContent = state.to;
  setFlag(fromFlag, state.from);
  setFlag(toFlag, state.to);
}

function buildPickerList(filter){
  const q = (filter || '').trim().toUpperCase();
  const codes = Object.keys(CURRENCIES).sort();
  pickerList.innerHTML = '';
  const current = state.pickerTarget === 'from' ? state.from : state.to;
  let shown = 0;
  for(const code of codes){
    const [name, iso] = CURRENCIES[code];
    if(q && !code.includes(q) && !name.toUpperCase().includes(q)) continue;
    shown++;
    const item = document.createElement('div');
    item.className = 'picker-item' + (code === current ? ' selected' : '');
    item.innerHTML = `
      <div class="flag-circle"><span class="fi fi-${iso}"></span></div>
      <span class="code">${code}</span>
      <span class="name">${name}</span>
      <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>
    `;
    item.addEventListener('click', () => selectCurrency(code));
    pickerList.appendChild(item);
  }
  if(shown === 0){
    pickerList.innerHTML = '<div class="picker-empty">No currencies match your search.</div>';
  }
}

function openPicker(target){
  state.pickerTarget = target;
  pickerSearch.value = '';
  buildPickerList('');
  pickerBackdrop.classList.add('open');
  setTimeout(() => pickerSearch.focus(), 0);
}

function closePicker(){
  pickerBackdrop.classList.remove('open');
  state.pickerTarget = null;
}

function selectCurrency(code){
  if(state.pickerTarget === 'from') state.from = code;
  else if(state.pickerTarget === 'to') state.to = code;
  closePicker();
  renderTriggers();
  convert();
}

fromTrigger.addEventListener('click', () => openPicker('from'));
toTrigger.addEventListener('click', () => openPicker('to'));
pickerBackdrop.addEventListener('click', (e) => { if(e.target === pickerBackdrop) closePicker(); });
pickerSearch.addEventListener('input', () => buildPickerList(pickerSearch.value));

async function convert(){
  const amount = parseFloat(amountEl.value) || 0;
  const from = state.from, to = state.to;
  if(from === to){
    rateValue.textContent = `1 ${from} = 1 ${to}`;
    resultAmount.textContent = fmt(amount);
    statusEl.textContent = 'Same currency selected';
    statusEl.classList.remove('err');
    return;
  }
  statusEl.textContent = 'Fetching live rate…';
  statusEl.classList.remove('err');
  try{
    const res = await fetch(`${API}/latest?base=${from}&symbols=${to}`);
    if(!res.ok) throw new Error('Rate lookup failed');
    const data = await res.json();
    const rate = data.rates[to];
    rateValue.textContent = `1 ${from} = ${fmt(rate)} ${to}`;
    resultAmount.textContent = fmt(amount * rate);
    statusEl.textContent = 'Rate date: ' + data.date;
    loadStats(from, to);
  }catch(err){
    statusEl.textContent = 'Could not reach the rate service. Try again shortly.';
    statusEl.classList.add('err');
  }
}

async function loadStats(from, to){
  try{
    const end = new Date();
    const start = new Date();
    start.setDate(end.getDate() - 30);
    const iso = d => d.toISOString().slice(0,10);
    const res = await fetch(`${API}/${iso(start)}..${iso(end)}?base=${from}&symbols=${to}`);
    if(!res.ok) throw new Error('History lookup failed');
    const data = await res.json();
    const values = Object.values(data.rates).map(r => r[to]).filter(v => typeof v === 'number');
    if(!values.length) return;
    const high = Math.max(...values), low = Math.min(...values);
    const avg = values.reduce((a,b)=>a+b,0) / values.length;
    statHigh.textContent = fmt(high);
    statLow.textContent = fmt(low);
    statAvg.textContent = fmt(avg);
  }catch(err){
    statHigh.textContent = statLow.textContent = statAvg.textContent = '—';
  }
}

document.getElementById('swap').addEventListener('click', () => {
  const f = state.from;
  state.from = state.to;
  state.to = f;
  renderTriggers();
  convert();
});

amountEl.addEventListener('input', convert);

renderTriggers();
convert();
</script>
</body>
</html>
